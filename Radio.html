<html>
    
        <title>Kansha Radio - Tamil Stations</title>
<body>

   <style>
        /* Modern full-page background with a radio image */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Using a high-quality, dark radio background from Unsplash */
            background: url('RadioBG.JPG') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
        }
        
        /* The simulated physical Radio Interface Container */
        .radio-chassis {
            width: 200px;
            color: #fff;
            text-align: center;
                        padding: 25px;
            
        }

        .radio-display {
            
            border: 0px solid #5f4e3e;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            
        }

        #searchBar {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: none;
            background: #1f1e1e;
            color: #dbcca3;
            text-align: center;
        }

        #stationList {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: none;
            background: #1f1e1e;
            color: #fcae06; /* Vintage green text */
            font-weight: bold;
            cursor: pointer;
        }

        
        /* Tactile physical buttons grid */
        .button-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .radio-btn {
            background: linear-gradient(135deg, #555, #0c0c0c);
            border: 1px solid #0c0b0b;
            border-radius: 6px;
            color: white;
            padding: 12px 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px #111;
            transition: all 0.1s ease;
            font-size: 14px;
        }

        .radio-btn:active {
            box-shadow: 0 1px #111;
            transform: translateY(2px);
        }

        /* Play button modifications: Vibrant neon green aesthetic when playing */
        .radio-btn.playing {
           background: linear-gradient(135deg, #fc0505, #550600);
            border-color: #330000;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
            box-shadow: 0 3px #212200, 0 0 10px rgba(0, 204, 27, 0.4);
        }

        /* Invisible audio node since we use physical buttons */
        audio {
            display: none;
        }
    </style>
</head>
<body>

<div class="radio-chassis">
    <div class="radio-display">
        <input type="text" id="searchBar" placeholder="🔍 Search Station...">
        <select id="stationList"></select>
    </div>

    <div class="button-pad">
        <button class="radio-btn" id="btnPrev">⏮</button>
        <button class="radio-btn" id="btnPlayPause">▶</button>
        <button class="radio-btn" id="btnNext">⏭</button>
    </div>
</div>

<audio id="radioPlayer" autoplay></audio>

<script>
    const stationList = document.getElementById('stationList');
    const radioPlayer = document.getElementById('radioPlayer');
    const searchBar = document.getElementById('searchBar');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    
    let allStations = [

 { name: "Om Vinayaga", url_resolved: "https://cast6.asurahosting.com/proxy/ayngaranradio/stream" },

{ name: "Om Namasivaya", url_resolved: "https://cast6.asurahosting.com/proxy/aadhisivam/stream" },

{ name: "Bakthi", url_resolved: "https://listen.openstream.co/3641/audio" },



 { name: "80s Songs", url_resolved: "https://stream.zeno.fm/48w230kx8vzuv.aac" },
 { name: "90s Songs", url_resolved: "https://stream.zeno.fm/tqnws2eafwzuv.aac" },
 { name: "Chillax", url_resolved: "http://stream.zeno.fm/ohhsihm2byluv" },
 { name: "SPB Melodies", url_resolved: "https://webpermission.southradios.net/play/spbradio" },
 { name: "Yesudas", url_resolved: "https://webpermission.southradios.net/play/kjyesudas" },

 { name: "Harris Jayaraj", url_resolved: "http://stream.zeno.fm/ob6tjg8gulptv" },
 { name: "Ilayaraja FM", url_resolved: "https://psrlive2.listenon.in/ir?ah=0e81749e37789e5fb8c290926ce87e3f" },
 { name: "Ilayaraja Lite", url_resolved: "https://webpermission.southradios.net/play/ilayarajalite" },
 { name: "Mohan Hitz", url_resolved: "https://psrlive4.listenon.in/mohan?station=mohanradio" },
 { name: "MS Viswanathan", url_resolved: "http://stream.zeno.fm/x7wc1xgllvsvv" },
 { name: "Janaki Hits", url_resolved: "https://psrlive2.listenon.in/janaki?station=janakiradio" },
 { name: "Yuvan Shankar Raja", url_resolved: "https://psrlive2.listenon.in/ysr?ah=0e81749e37789e5fb8c290926ce87e3f" },
 { name: "Aniruth", url_resolved: "https://psrlive2.listenon.in/anirud?ah=0e81749e37789e5fb8c290926ce87e3f" },
 { name: "BIG FM", url_resolved: "https://stream.zeno.fm/r2gn1pgm4qruv" },
 { name: "Suryan FM", url_resolved: "https://radios.crabdance.com:8002/2" },
 { name: "Radio Mirchi", url_resolved: "https://radios.crabdance.com:8002/1" },
{ name: "Radio City", url_resolved: "https://radios.crabdance.com:8002/5" },
{ name: "Hello FM", url_resolved: "https://radios.crabdance.com:8002/3" }
    ];

    // Populate immediately
    populateStationList(allStations);
    if (allStations.length > 0) {
        changeStation(0);
    }

    function populateStationList(stationsToDisplay) {
        stationList.innerHTML = '';

        if (stationsToDisplay.length === 0) {
            const noMatchOption = document.createElement('option');
            noMatchOption.textContent = "No stations found";
            noMatchOption.disabled = true;
            stationList.appendChild(noMatchOption);
            return;
        }

        stationsToDisplay.forEach((station, index) => {
            const option = document.createElement('option');
            option.value = station.url_resolved;
            option.dataset.index = index;
            option.textContent = station.name;
            stationList.appendChild(option);
        });
    }

    function changeStation(index) {
        if (stationList.options[index]) {
            stationList.selectedIndex = index;
            radioPlayer.src = stationList.options[index].value;
            playRadio();
        }
    }

    function playRadio() {
        radioPlayer.play()
            .then(() => {
                btnPlayPause.textContent = "⏸";
                btnPlayPause.classList.add('playing');
            })
            .catch(err => console.error("Playback interrupted:", err));
    }

    function togglePlay() {
        if (radioPlayer.paused) {
            playRadio();
        } else {
            radioPlayer.pause();
            btnPlayPause.textContent = "▶ PLAY";
            btnPlayPause.classList.remove('playing');
        }
    }

    // Button events
    btnPlayPause.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', () => {
        let nextIndex = stationList.selectedIndex + 1;
        if (nextIndex >= stationList.options.length) nextIndex = 0;
        changeStation(nextIndex);
    });
    btnPrev.addEventListener('click', () => {
        let prevIndex = stationList.selectedIndex - 1;
        if (prevIndex < 0) prevIndex = stationList.options.length - 1;
        changeStation(prevIndex);
    });

    // Search filter
    searchBar.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filteredStations = allStations.filter(station => 
            station.name.toLowerCase().includes(searchTerm)
        );
        populateStationList(filteredStations);
        if (filteredStations.length > 0) changeStation(0);
    });

    stationList.addEventListener('change', () => {
        radioPlayer.src = stationList.value;
        playRadio();
    });
</script>


            </ul>
        </div>
</body>
</html>
